name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\HamTech-M0FXB-FT857D.sln
      - name: Test CAT protocol
        run: dotnet test .\FT857DControl.Tests.csproj -c Release --no-restore
      - name: Publish self-contained Windows x64 app
        run: dotnet publish .\FT857DControl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
      - name: Create user ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-package | Out-Null
          Copy-Item .\publish\HamTech-M0FXB-FT857D-Controller.exe .\release-package\
          Copy-Item .\README-USER.txt .\release-package\
          Compress-Archive -Path .\release-package\* -DestinationPath .\HamTech-M0FXB-FT857D-Controller-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: HamTech-M0FXB-FT857D-Controller-Windows-x64
          path: HamTech-M0FXB-FT857D-Controller-Windows-x64.zip
      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "HamTech M0FXB FT-857D Controller ${{ github.ref_name }}" --notes "Windows x64 self-contained release. Download the Windows-x64 ZIP from Assets, extract it, and run the EXE." }
          gh release upload "${{ github.ref_name }}" .\HamTech-M0FXB-FT857D-Controller-Windows-x64.zip --clobber
